name: Dependabot auto-merge

# dependabot.yml already ignores major versions, so every Dependabot pull request into develop is a
# minor or patch bump. This approves it and turns on auto-merge: GitHub merges it only after every
# required check passes. It never checks out the pull request's code and runs nothing from it.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Approve and enable auto-merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
